{% extends "admin/voting/base.html" %}{% block content %}<div class="vote-shell"><h1>Створити нове голосування</h1><section class="vote-card"><h2>Як називається конкурс?</h2><p>Наприклад: «Велесова ніч — конкурс костюмів» або «Тест — репетиція».</p>{% if error %}<p class="vote-error" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="session-name">Назва голосування</label><input id="session-name" name="name" required maxlength="200" value="{{ request.POST.name }}"><div class="vote-actions"><a href="{% url 'admin:voting_index' %}">Назад</a><button class="vote-primary" type="submit">Створити та налаштувати журі →</button></div></form></section></div>{% endblock %}
